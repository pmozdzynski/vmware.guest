---
vmguest_name: "{{ inventory_hostname_short }}"
vmguest_ip: "{{ lookup('dig', '{{ inventory_hostname_short }}.{{ ad_domain|lower }}')}}"
vm_guest_disks:
      - size_gb: "{{ vmguest_disk_size }}"
        type: thin
        datastore: "{{ vmguest_datastore }}"
vm_guest_networks:
      - name: "{{ vmguest_vlan }}"
        ip: "{{ vmguest_ip }}"
        netmask: "{{ vmguest_netmask }}"
        gateway: "{{ vmguest_gateway }}"
        dns_servers:
          - "{{ nameserver1 }}"
          - "{{ nameserver2 }}"
        domain: "{{ vmguest_domain }}"
vmguest_template_username: ansible
vmguest_template_password: qaz123

